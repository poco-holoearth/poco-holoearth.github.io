<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./img/icon.webp" type="image/webp" />
  <title>pocoの部屋</title>
  <style>
    :root {
      --bg-color: #f0f8ff;
      --text-color: #000;
      --card-bg: #fff;
      --footer-color: #888;
    }

    body.dark {
      --bg-color: #1e1e1e;
      --text-color: #fff;
      --card-bg: #2a2a2a;
      --footer-color: #aaa;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      text-align: center;
      padding: 50px 20px;
      margin: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    .profile {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
      margin: 0 auto 30px;
      display: block;
      box-sizing: border-box;
    }

    .profile img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile h1 {
      margin: 15px 0 5px;
      font-size: 28px;
    }

    .profile p {
      font-size: 16px;
      color: var(--text-color);
    }

    .social a {
      margin: 0 10px;
      text-decoration: none;
      color: #1e90ff;
    }

    .social a:hover {
      text-decoration: underline;
    }

    .more-about {
      max-width: 600px;
      background-color: var(--card-bg);
      padding: 20px;
      margin: 0 auto 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
      text-align: center;
      word-break: break-word;
      box-sizing: border-box;
    }

    .clock {
      font-size: 14px;
      margin-bottom: 10px;
      color: #777;
    }

    footer {
      margin-top: 50px;
      font-size: 14px;
      color: var(--footer-color);
    }

    #toggle-theme {
      position: fixed;
      top: 15px;
      right: 15px;
      background: #ccc;
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      z-index: 999;
    }

    @media (max-width: 600px) {
      .more-about {
        padding: 15px;
        margin: 0 10px 30px;
      }

      #toggle-theme {
        right: 5px;
        font-size: 12px;
        padding: 8px 12px;
      }
    }
  </style>
</head>

<body>
  <button id="toggle-theme">🌙</button>

  <div class="profile">
    <img src="./img/icon.webp" alt="icon" />
    <h1>poco</h1>
    <p>pocoです。このサイトには何もありません。</p>

    <div class="clock" id="clock"></div>

    <div class="social">
      <a href="https://x.com/poco_Holoearth" target="_blank" rel="noopener">Twitter</a>
      <a href="https://github.com/poco-holoearth" target="_blank" rel="noopener">GitHub</a>
      <a href="https://discord.com/users/1045302263087890513" target="_blank" rel="noopener">Discord</a>
      <a href="mailto:poco@poco.f5.si">メール</a>
    </div>
  </div>

  <div class="more-about">
    <h2>pocoとは</h2>
    <p>
      そこら辺にいる一般人です。<br />
      プログラマーではないです。<br />
      趣味はカメラだったりPC,ゲームです。<br />
      何かしら連絡したい場合はDiscordかEmailまでどうぞ。
    </p>
  </div>

  <footer>
    @poco_Holoearth
  </footer>

  <script>
    const toggleBtn = document.getElementById('toggle-theme');
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      toggleBtn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    });

    const clock = document.getElementById('clock');
    function updateClock() {
      const now = new Date();

      const year = now.getFullYear();
      const month = (now.getMonth() + 1).toString().padStart(2, '0'); 
      const day = now.getDate().toString().padStart(2, '0');
      const h = now.getHours().toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');
      const s = now.getSeconds().toString().padStart(2, '0');

      const daysOfWeek = ["日", "月", "火", "水", "木", "金", "土"];
      const dayOfWeek = daysOfWeek[now.getDay()];

      const formattedDate = `${year}/${month}/${day} (${dayOfWeek}) ${h}:${m}:${s}`;

      document.getElementById('clock').textContent = formattedDate;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>

</html>
